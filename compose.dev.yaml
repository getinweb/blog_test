services:
  php:
    image: ${COMPOSE_PROJECT_NAME:-blog_test}-php:dev
    build:
      target: dev
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
    volumes:
      - ./app:/var/www/app

  nginx:
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    volumes:
      - ./app/public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  sass:
    build:
      context: .
      dockerfile: docker/sass/Dockerfile
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
    command:
      - --watch
      - --poll
      - --style=expanded
      - --embed-source-map
      - --embed-sources
      - --no-error-css
      - assets/scss:public/assets/css

  php-test:
    image: ${COMPOSE_PROJECT_NAME:-blog_test}-php:dev
    profiles: [test]
    working_dir: /var/www/app
    command: [composer, test]
    environment:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_TIMEZONE: UTC
      DB_HOST: mysql-test
      DB_PORT: '3306'
      DB_DATABASE: blog_test
      DB_USERNAME: blog_test
      DB_PASSWORD: blog_test_dev
    volumes:
      - ./app:/var/www/app
    networks: [test]
    depends_on:
      mysql-test:
        condition: service_healthy

  mysql-test:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    profiles: [test]
    environment:
      MYSQL_DATABASE: blog_test
      MYSQL_USER: blog_test
      MYSQL_PASSWORD: blog_test_dev
      MYSQL_ROOT_PASSWORD: blog_test_root_dev
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    tmpfs:
      - /var/lib/mysql
    networks: [test]
    healthcheck:
      test: >-
        MYSQL_PWD="$${MYSQL_PASSWORD}" mysql
        --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
        --execute='SELECT 1' --silent > /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  test:
    internal: true
