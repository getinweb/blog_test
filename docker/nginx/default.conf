server {
    listen 80;
    server_name _;
    root /var/www/app/public;
    index index.php;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ "^/images/[a-f0-9]{64}\.(jpg|png|webp)$" {
        root /var/www/app/var;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location /images/ {
        return 404;
    }

    location = /index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
