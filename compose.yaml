name: ${COMPOSE_PROJECT_NAME:-blog_test}

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: base
    working_dir: /var/www/app
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-blog}
      DB_USERNAME: ${DB_USERNAME:-blog}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ARTICLES_PER_PAGE: ${ARTICLES_PER_PAGE:-12}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-5242880}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: >-
        SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET
        cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-blog}
      MYSQL_USER: ${DB_USERNAME:-blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: >-
        MYSQL_PWD="$${MYSQL_PASSWORD}" mysql
        --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
        --execute='SELECT 1' --silent > /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
